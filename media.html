<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — David Kay</title>
<meta name="description" content="Photo gallery of David Kay conducting across concerts, festivals and community events.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">David Kay <span class="brand-sub">&mdash; Conductor &amp; Educator</span></a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links">
      <li><a href="about.html">Biography</a></li>
      <li><a href="media.html" aria-current="page">Gallery</a></li>
      <li><a href="repertoire.html">Repertoire</a></li>
      <li><a href="contact.html" class="btn btn-accent">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
<div class="page-hero" style="background-image:url('images/hero-media.webp')">
  <div class="wrap">
    <h1>Gallery</h1>
  </div>
</div>

<section class="section-tight-top">
  <div class="wrap">
    <div class="grid-photos">
      <button type="button" class="photo-tile"><img src="images/gallery/apo-connecting-2020-thumb.webp" data-full="images/gallery/apo-connecting-2020-full.webp" alt="David Kay conducting" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/apo-does-disco-thumb.webp" data-full="images/gallery/apo-does-disco-full.webp" alt="David Kay conducting APO Does Disco" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/bic-runga-thumb.webp" data-full="images/gallery/bic-runga-full.webp" alt="David Kay with Bic Runga" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/big-play-in-thumb.webp" data-full="images/gallery/big-play-in-full.webp" alt="David Kay conducting Big Play In" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/discovery-2024-a-thumb.webp" data-full="images/gallery/discovery-2024-a-full.webp" alt="David Kay conducting Discovery 2024" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/conducting-1-thumb.webp" data-full="images/gallery/conducting-1-full.webp" alt="David Kay conducting" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/discovery-2024-b-thumb.webp" data-full="images/gallery/discovery-2024-b-full.webp" alt="David Kay conducting Discovery 2024" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/conducting-2-thumb.webp" data-full="images/gallery/conducting-2-full.webp" alt="David Kay conducting" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/discovery-2025-thumb.webp" data-full="images/gallery/discovery-2025-full.webp" alt="David Kay conducting Discovery 2025" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/winter-gala-2023-thumb.webp" data-full="images/gallery/winter-gala-2023-full.webp" alt="David Kay conducting Winter Gala 2023" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/portrait-thumb.webp" data-full="images/gallery/portrait-full.webp" alt="David Kay portrait" loading="lazy"></button>
      <button type="button" class="photo-tile"><img src="images/gallery/headshot-thumb.webp" data-full="images/gallery/headshot-full.webp" alt="David Kay headshot" loading="lazy" style="object-position: center 15%;"></button>
    </div>
    <p class="photo-credit">Photo credit &mdash; Thomas Hamill, <a href="http://www.thomashamillphotography.com">thomashamillphotography.com</a></p>
  </div>
</section>
</main>

<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
  <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous photo">&#8249;</button>
  <img src="" alt="" class="lightbox-img">
  <button type="button" class="lightbox-nav lightbox-next" aria-label="Next photo">&#8250;</button>
  <p class="lightbox-caption"></p>
</div>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span>&copy; <span id="copyright-year"></span> David Kay</span>
    <span>Website by <a href="https://torqweb.nz">TORQ Web</a></span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
