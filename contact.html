<div class="page-hero" style="background-image:url('https://images.squarespace-cdn.com/content/v1/68ed5b6185ea80090668a76d/777d9d1a-9e98-44c5-a541-595b474d31ca/Discovery+2024+085+T+Hamill+%28Large%29.jpg')">
  <div class="wrap">
    <span class="eyebrow">Contact</span>
    <h1>Get in touch</h1>
    <p>Do get in touch &mdash; I'd love to hear from you.</p>
  </div>
</div>

<section class="section-tight-top">
  <div class="wrap prose">
    <ul class="detail-list">
      <li><span class="k">Email</span><span><a href="mailto:dkay14@gmail.com">dkay14@gmail.com</a></span></li>
      <li><span class="k">Phone</span><span><a href="tel:+64211778295">+64 21 177 8295</a></span></li>
      <li><span class="k">Location</span><span>Auckland, New Zealand</span></li>
    </ul>
  </div>
</section>

<section class="section-tight-top">
  <div class="wrap">
    <form class="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <p class="hidden-field"><label>Don&rsquo;t fill this out if you&rsquo;re human: <input name="bot-field"></label></p>
      <div class="form-row">
        <div class="form-field">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" name="first-name" required>
        </div>
        <div class="form-field">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="last-name" required>
        </div>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>
      <button type="submit" class="btn btn-gold">Send</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span>Auckland, New Zealand &nbsp;&middot;&nbsp; <a href="mailto:dkay14@gmail.com">dkay14@gmail.com</a> &nbsp;&middot;&nbsp; <a href="tel:+64211778295">+64 21 177 8295</a></span>
